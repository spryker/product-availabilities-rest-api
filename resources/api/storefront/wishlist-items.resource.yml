resource:
    name: WishlistItems
    shortName: wishlist-items

    properties:
        availability:
            type: object
            objectName: ProductAvailability
            writable: false
            readable: true
            required: false
            description: 'The concrete product availability for the wishlist item.'
            properties:
                isNeverOutOfStock:
                    type: boolean
                    description: 'Whether the product is flagged as never out of stock.'
                    openapiContext:
                        example: false
                availability:
                    type: integer
                    description: 'Available quantity of the product.'
                    openapiContext:
                        example: 10
                stockQuantity:
                    type: integer
                    description: 'Current stock quantity of the product.'
                    openapiContext:
                        example: 10
